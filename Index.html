<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MinFocus | Main</title>

<style>
/* ---------- Global ---------- */
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#ffffff;
  text-align:center;
}

/* ---------- Splash ---------- */
#splash{
  position:fixed;
  inset:0;
  background:#ffffff;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}
#splash img{
  width:160px;
  animation:logoAnim 3s ease;
}
@keyframes logoAnim{
  0%{opacity:0; transform:scale(0.7);}
  40%{opacity:1; transform:scale(1.05);}
  100%{opacity:1; transform:scale(1);}
}

/* ---------- Content ---------- */
#content{
  display:none;
  padding:25px;
}

/* Navbar */
.navbar{
  background:#2ecc71;
  padding:12px;
  display:flex;
  justify-content:center;
  gap:25px;
  border-radius:14px;
}
.navbar a{
  color:white;
  font-weight:bold;
  text-decoration:none;
  cursor:pointer;
}

/* Welcome */
#welcome{
  margin:30px 0;
  font-size:22px;
  color:#333;
}

/* Progress Circle */
.progress{
  width:180px;
  height:180px;
  border-radius:50%;
  margin:35px auto;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:28px;
  font-weight:bold;
  color:#2ecc71;
  background:conic-gradient(#2ecc71 0%, #e6f7ec 0%);
}

/* CTA */
#sessionBtn{
  padding:18px 34px;
  border:none;
  border-radius:18px;
  background:#2ecc71;
  color:white;
  font-size:20px;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- Splash Screen -->
<div id="splash">
  <!-- غيري اسم الصورة لو مختلف -->
  <img src="logo.png" alt="MinFocus Logo">
</div>

<!-- Main Content -->
<div id="content">

  <div class="navbar">
    <a href="index.html">Main</a>
    <a href="profile.html">Profile</a>
  </div>

  <div id="welcome"></div>

  <div class="progress" id="progress">0%</div>

  <button id="sessionBtn" onclick="enterSession()">الدخول للجلسة</button>

</div>

<script>
/* ---------- Splash Logic ---------- */
setTimeout(()=>{
  document.getElementById("splash").style.display="none";
  document.getElementById("content").style.display="block";
},3000);

/* ---------- Login State ---------- */
const isLoggedIn = localStorage.getItem("isLoggedIn") === "true";
const username = localStorage.getItem("username");

/* Welcome Text */
document.getElementById("welcome").innerText =
  isLoggedIn && username
    ? `أهلاً ${username} 👋`
    : "جاهزة نركّز؟ سجّلي دخولك وابدئي 💚";

/* ---------- Progress (Month Tasks) ---------- */
function updateProgress(){
  const monthTasks =
    JSON.parse(localStorage.getItem("monthTasks") || "[]");

  const done =
    monthTasks.filter(task => task.status === "end").length;

  const percent =
    monthTasks.length ? Math.round((done / monthTasks.length) * 100) : 0;

  const progress = document.getElementById("progress");
  progress.innerText = percent + "%";
  progress.style.background =
    `conic-gradient(#2ecc71 ${percent}%, #e6f7ec ${percent}%)`;
}

updateProgress();

/* ---------- Session Button ---------- */
function enterSession(){
  if(!isLoggedIn){
    window.location.href = "login.html";
  }else{
    window.location.href = "session.html";
  }
}
</script>

</body>
</html>
